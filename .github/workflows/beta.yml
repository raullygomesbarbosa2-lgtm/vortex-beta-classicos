name: Vortex Beta — 10 sistemas clássicos
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Install Android SDK and NDK
        run: |
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$S" --sdk_root="$ANDROID_HOME" --licenses
          "$S" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1"
      - name: Build ten official Libretro system cores for ARM64
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          build_core() {
            id="$1" repo="$2" branch="$3" subdir="$4" output="$5"
            src="$RUNNER_TEMP/$id"
            git clone --depth 1 --branch "$branch" "$repo" "$src"
            cd "$src/$subdir"
            "$ANDROID_HOME/ndk/${NDK_VERSION}/ndk-build" APP_ABI=arm64-v8a APP_PLATFORM=android-23 -j2
            core=$(find "$src" -type f -path '*/arm64-v8a/libretro.so' -print -quit)
            test -n "$core"
            cp "$core" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/lib${output}"
          }
          build_core stella2014 https://github.com/libretro/stella2014-libretro.git master jni stella2014_libretro_android.so
          build_core fceumm https://github.com/libretro/libretro-fceumm.git master jni fceumm_libretro_android.so
          build_core snes9x https://github.com/libretro/snes9x.git master libretro/jni snes9x_libretro_android.so
          build_core gambatte https://github.com/libretro/gambatte-libretro.git master libgambatte/libretro/jni gambatte_libretro_android.so
          build_core mednafen_gba https://github.com/libretro/beetle-gba-libretro.git master jni mednafen_gba_libretro_android.so
          build_core mednafen_ngp https://github.com/libretro/beetle-ngp-libretro.git master jni mednafen_ngp_libretro_android.so
          build_core mednafen_pce_fast https://github.com/libretro/beetle-pce-fast-libretro.git master jni mednafen_pce_fast_libretro_android.so
          build_core mednafen_lynx https://github.com/libretro/beetle-lynx-libretro.git master jni mednafen_lynx_libretro_android.so
          build_core genesis_plus_gx https://github.com/libretro/Genesis-Plus-GX-Wide.git main libretro/jni genesis_plus_gx_libretro_android.so
          build_core mednafen_wswan https://github.com/libretro/beetle-wswan-libretro.git master jni mednafen_wswan_libretro_android.so
          cd "$GITHUB_WORKSPACE"
      - name: Verify ten native ARM64 core libraries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('app/src/main/jniLibs/arm64-v8a')
          libs=list(p.glob('*.so'))
          if len(libs)!=10: raise SystemExit(f'Expected 10 cores, found {len(libs)}')
          for f in libs:
            d=f.read_bytes()
            if d[:6]!=b'\x7fELF\x02\x01' or struct.unpack_from('<H',d,18)[0]!=183: raise SystemExit(f'Not ARM64 ELF: {f}')
          print('Ten ARM64 Libretro core libraries verified.')
          PY
      - name: Sign Beta APK with temporary CI key
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/vortex-beta.jks" -storepass beta-ci-only -keypass beta-ci-only -alias vortex-beta -dname 'CN=Vortex Beta CI,O=Vortex Beta,C=BR' -keyalg RSA -keysize 2048 -validity 3650
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle'); s=p.read_text().replace('android {','''android {
              signingConfigs { betaRelease { storeFile file(System.getenv("CI_KEYSTORE")); storePassword System.getenv("CI_STORE_PASSWORD"); keyAlias System.getenv("CI_KEY_ALIAS"); keyPassword System.getenv("CI_KEY_PASSWORD") } }
              buildTypes { release { signingConfig signingConfigs.betaRelease; minifyEnabled false } }''',1); p.write_text(s)
          PY
          echo "CI_KEYSTORE=$RUNNER_TEMP/vortex-beta.jks" >> "$GITHUB_ENV"
          echo 'CI_STORE_PASSWORD=beta-ci-only' >> "$GITHUB_ENV"
          echo 'CI_KEY_ALIAS=vortex-beta' >> "$GITHUB_ENV"
          echo 'CI_KEY_PASSWORD=beta-ci-only' >> "$GITHUB_ENV"
      - name: Assemble and verify APK
        run: |
          gradle assembleRelease --no-daemon
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          p=Path('app/build/outputs/apk/release/app-release.apk')
          if not p.exists() or p.stat().st_size < 20_000_000: raise SystemExit(f'APK missing or unexpectedly small: {p}')
          with ZipFile(p) as z:
            n=z.namelist(); libs=[x for x in n if x.startswith('lib/arm64-v8a/') and x.endswith('.so')]
            if len(libs)<11: raise SystemExit(f'Expected frontend plus ten cores, found {len(libs)} native libs')
            if any(x.startswith('lib/armeabi') for x in n): raise SystemExit('Unexpected ABI packaged')
          print('APK built and contains ten core libraries:', p.stat().st_size, 'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Vortex-Beta-Classicos-Android6plus-ARM64
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-build-${{ github.run_number }}
          name: Vortex Beta Clássicos — build ${{ github.run_number }}
          body: 'Beta Android 6+ ARM64, criada do zero. 10 sistemas, sem ROM/BIOS incluídos. Builds CI ainda precisam de teste em aparelho e ROMs do usuário.'
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
